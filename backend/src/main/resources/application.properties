# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Open-Meteo Weather API Configuration
weather.api.base-url=https://api.open-meteo.com/v1
weather.geocoding.base-url=https://geocoding-api.open-meteo.com/v1

# Request timeouts (milliseconds)
weather.api.timeout.connect=5000
weather.api.timeout.read=10000

# Cache configuration (duration in minutes)
weather.cache.duration-minutes=10
weather.cache.max-size=100

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.cors.allowed-methods=GET,POST,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Logging
logging.level.com.weatherpredictor=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always